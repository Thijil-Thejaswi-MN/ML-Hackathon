# LightGBM (M2) - untuned configuration (common defaults for ~2M-row tabular data).
n_estimators: 400
learning_rate: 0.05
num_leaves: 63
max_depth: -1
min_child_samples: 50
subsample: 0.8
subsample_freq: 1
colsample_bytree: 0.8
reg_alpha: 0.0
reg_lambda: 1.0
is_unbalance: false
random_state: 42
n_jobs: -1
