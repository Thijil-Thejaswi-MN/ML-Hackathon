# Random Forest - configuration that produced the reported results (results/models/rf/config.yaml).
# Re-running `python scripts/03_train_model.py --model rf` reproduces the RF row of results/model_comparison.csv.
n_estimators: 100
max_depth: 12
min_samples_split: 5
min_samples_leaf: 2
class_weight: balanced_subsample
random_state: 42
n_jobs: -1
