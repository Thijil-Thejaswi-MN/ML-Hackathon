# Distance-weighted KNN (M2) - untuned configuration. Inputs are standardised (artifacts/scaler.joblib).
n_neighbors: 25        # enough neighbours for a smooth vote-fraction probability
weights: distance      # closer neighbours count more
p: 2                   # Euclidean distance in standardised feature space
max_train_rows: 60000  # seeded, class-stratified subsample: prediction cost grows with stored rows
random_state: 42
n_jobs: -1
